name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: The version name of the installed app, for example 0.1.0, or the release tag
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV model and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Do not paste addresses of your catalog server or any personal data.
      render: text
